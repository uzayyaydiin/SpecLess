[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specless-astro"
version = "0.2.1"
description = "SpecLess: photometry-based machine learning tools for galaxy classification"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

authors = [
    {name = "Uzay Aydın"}
]

keywords = [
    "astronomy",
    "astrophysics",
    "galaxies",
    "galaxy-classification",
    "photometry",
    "machine-learning",
    "sdss",
    "wise",
    "kids",
    "xgboost"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=3.1,<4"
]

[project.urls]
Homepage = "https://github.com/uzayyaydiin/SpecLess"
Repository = "https://github.com/uzayyaydiin/SpecLess"
Issues = "https://github.com/uzayyaydiin/SpecLess/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specless_astro = [
    "resources/model1/*.json",
    "resources/model2/*.json"
]
