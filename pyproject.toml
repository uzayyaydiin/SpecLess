[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specless-astro"
version = "0.1.0"
description = "SpecLess: photometry-based machine learning tools for galaxy classification"
requires-python = ">=3.10"
authors = [
    {name = "Uzay Aydın"}
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=3.1,<4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specless_astro = [
    "resources/model1/*.json"
]
